[project]
name = "aieb"
version = "0.1.0"
description = "AI External Brain（AI 外脑 Demo）—— 企业知识管理、会议分析、风险预警与任务追踪的 AI 工作台（基于开源 Agent 框架二次开发）"
requires-python = ">=3.11"
dependencies = [
    "textual>=2.1.0",
    "anthropic>=0.42.0",
    "openai>=1.60.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "mcp>=1.12.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "pymupdf>=1.24",
    "python-pptx>=0.6.23",
]

[project.optional-dependencies]
# 混合检索（Hybrid RAG）。刻意不引入 torch：走 ONNX Runtime，CPU 可跑、
# 模型清单带许可信息（bge/Qwen 均为 MIT/Apache-2.0）。
hybrid = [
    "qdrant-client==1.20.0",
    "fastembed==0.9.1",
    "onnxruntime>=1.31.1",
]
# 有状态工作流（LangGraph）。与 hybrid 一样是**可选**的：不装它时
# `aieb.workflow` 导入会给出明确提示，其余功能（含原生 Agent Loop）不受影响。
langgraph = [
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-openai==1.7.4",
    "aiosqlite>=0.22",
]

[project.scripts]
# 主入口：AI 外脑 Demo 的浏览器工作台
aieb = "aieb.brain.cli:main"
# 旧命令行名：作为兼容别名保留，指向同一个 TUI 入口（不再作为主流程）
wendream = "aieb.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["aieb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# 显式声明 async fixture 的事件循环作用域，避免新版本 pytest-asyncio 告警
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    # 真实浏览器验收（scripts/browser_e2e.py）；不作为运行时依赖
    "playwright>=1.40",
]
